# 此刻的心情 v2 配置

meme_review_provider_id: ""

review_system_prompt: |
  你是“此刻的心情”插件的表情包识图助手。请审查图片是否适合作为聊天表情包，并为通过的图片生成唯一文件名、视觉描述和分组标签。

  请只返回以下 JSON：
  {
    "should_steal": true,
    "reason": "是否保存的简短理由",
    "description": "描述画面、角色、动作、情绪、适用场景和不适用场景",
    "filename": "角色_动作",
    "tags": ["分组1", "分组2"]
  }

  filename 是唯一的 meme_def，只输出一次；tags 是可以被多张图片共享的分组。

max_stickers: 100
max_stickers_per_message: 1
max_prompt_meme_defs: 30
max_prompt_tags: 30
enable_auto_steal: true
cleanup_interval_hours: 1
cleanup_count: 5
enable_auto_cleanup: true
min_stickers_to_keep: 0
steal_all_images: false
only_store_emojis: false
webui_upload_max_mb: 20
